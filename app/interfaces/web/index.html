<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Camera</title>
<style>
@font-face {
  font-family: UbuntuSans;
  src: url('/ubuntu-sans.ttf') format('truetype');
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #10131a;
  color: #eef2f7;
  font-family: UbuntuSans, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 16px;
}
h1 { margin: 0; font-size: 20px; font-weight: 600; text-align: center; }
.stage {
  width: min(96vw, 960px);
  background: #000;
  border: 1px solid #2b3342;
  border-radius: 10px;
  overflow: hidden;
  line-height: 0;
}
.stage img { width: 100%; height: auto; display: block; }
.row {
  width: min(96vw, 960px);
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.card {
  flex: 1 1 300px;
  background: #171c26;
  border: 1px solid #2b3342;
  border-radius: 10px;
  padding: 12px;
}
.card h2 { margin: 0 0 8px; font-size: 15px; }
#result, #status {
  font-size: 13px;
  white-space: pre-wrap;
  color: #b8c4d6;
}
#status { color: #9fb0c8; }
</style>
</head>
<body>
<h1>AI Camera — Python capture → 20 fps → top-1 frame → person-wise age/gender</h1>

<div class="stage"><img id="out" alt="processed stream"></div>

<div class="row">
  <div class="card">
    <h2>Per-person result (mode)</h2>
    <div id="result">waiting…</div>
  </div>
  <div class="card">
    <h2>Status</h2>
    <div id="status">starting…</div>
  </div>
</div>

<script>
(() => {
  const token = new URLSearchParams(location.search).get('token') || '';
  const suffix = token ? `?token=${encodeURIComponent(token)}` : '';
  const out = document.getElementById('out');
  const resultBox = document.getElementById('result');
  const statusBox = document.getElementById('status');

  out.src = `/api/output/stream${suffix}`;

  async function refresh() {
    try {
      const response = await fetch(`/api/result${suffix}`);
      const data = await response.json();
      const cam = data.camera || {};
      const stats = data.stats || {};
      const timings = data.timings_ms || {};

      resultBox.textContent = JSON.stringify(data.result, null, 2);
      statusBox.textContent = [
        `camera: ${cam.opened ? 'open' : 'closed'} ${cam.source || ''} @ ${cam.fps || 0} fps`,
        `frames_in=${stats.frames_in} batches=${stats.batches} frames_out=${stats.frames_out}`,
        `yolo=${timings.yolo ?? 0}ms face=${timings.face ?? 0}ms age=${timings.age ?? 0}ms`,
        data.last_error ? `error: ${data.last_error}` : ''
      ].filter(Boolean).join('\n');
    } catch (err) {
      statusBox.textContent = `status error: ${err.message}`;
    }
  }

  refresh();
  setInterval(refresh, 1000);
})();
</script>
</body>
</html>
