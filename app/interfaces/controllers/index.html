<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Camera - Human + Face</title>
<style>
@font-face{font-family:'Ubuntu Sans';src:url('/ubuntu-sans.ttf') format('truetype');font-weight:100 900;font-display:swap}
html,body{height:100%}
body{background:#000;color:#eee;font-family:'Ubuntu Sans';text-align:center;margin:0;
     display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{padding:8px;background:#000;font-size:18px;flex:0 0 auto}
img#vid{flex:1 1 auto;min-height:0;width:100vw;object-fit:contain;background:#000}
.bar{flex:0 0 auto;padding:4px;font-size:13px}
.panel{background:#1e1e1e;display:inline-block;padding:6px 14px;border-radius:8px}
.panel b{color:#4fc3f7}
.info{color:#aaa}
a{color:#4fc3f7}
button,input,select{font-family:inherit}
button{margin:0 4px;background:#1e1e1e;color:#eee;border:1px solid #555;
       border-radius:5px;padding:4px 10px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);
       align-items:center;justify-content:center;z-index:10}
.modal.show{display:flex}
.modal-box{width:min(920px,94vw);max-height:86vh;background:#1e1e1e;
           border-radius:10px;display:flex;flex-direction:column}
.modal-head,.modal-foot{flex:0 0 auto;padding:10px 14px;display:flex;
                        align-items:center;justify-content:space-between}
.modal-head{border-bottom:1px solid #444;font-size:17px;color:#4fc3f7}
.modal-foot{border-top:1px solid #444;gap:8px}
.modal-body{overflow:auto;padding:10px 16px;text-align:left}
fieldset{border:1px solid #444;margin:0 0 10px;padding:8px 10px}
legend{color:#4fc3f7;padding:0 6px}
label{display:flex;justify-content:space-between;align-items:center;
      gap:12px;padding:3px 0}
label>span{color:#ccc;font-size:13px}
input,select{background:#111;color:#eee;border:1px solid #555;
             border-radius:4px;padding:4px 6px;width:300px}
input[type=checkbox]{width:auto}
small{color:#888;font-size:11px}
#setting-msg{color:#aaa;font-size:13px;margin-right:auto}
</style>
</head>
<body>
<header>AI Camera - Human / Face / Age / Gender (YOLOv11n + RetinaFace)</header>
<img id="vid" src="/video_feed">
<div class="bar"><span class="panel" id="s">loading stats... (1s update)</span></div>
<div class="bar">
<button onclick="setFlip('h')">Flip H: <span id="fh">-</span></button>
<button onclick="setFlip('v')">Flip V: <span id="fv">-</span></button>
<button onclick="resetFlip()">Reset</button>
<button onclick="openSettings()">Setting</button>
<span class="info">Green Human | Cyan Face | <b>Green [LOOK] = Looking</b> |
<a href="/api/stats">stats</a> | <a href="/api/faces">faces</a> | <a href="/api/health">health</a></span>
</div>
<div id="setting" class="modal" aria-hidden="true">
<div class="modal-box">
<div class="modal-head"><b>Setting</b><button onclick="closeSettings()">Close</button></div>
<div class="modal-body" id="setting-body">loading settings...</div>
<div class="modal-foot">
<span id="setting-msg"></span>
<button onclick="resetSettings()">Reset All</button>
<button onclick="closeSettings()">Cancel</button>
<button onclick="saveSettings()">Save</button>
</div>
</div>
</div>
<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const HEADERS = TOKEN ? {'Authorization': 'Bearer ' + TOKEN} : {};
document.getElementById('vid').src = '/video_feed' +
  (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '');
function esc(value){
  return String(value).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function tick(){
  try{
    const r = await fetch('/api/stats', {headers: HEADERS});
    const j = await r.json();
    const s = j.smoothed;
    document.getElementById('s').innerHTML =
      `Stable(${j.count_window}s) <b>H:${s.stable_human} F:${s.stable_face}</b> ` +
      `M:${s.stable_male} W:${s.stable_female} Look:${j.instant.looking} | ` +
      `infer:${j.infer_fps}fps age/gender ${j.window_sec}s:${j.age_gender.runs} ` +
      `${j.age_gender.last_ms}ms`;
    document.getElementById('fh').innerText = j.flip.h ? 'ON' : 'OFF';
    document.getElementById('fv').innerText = j.flip.v ? 'ON' : 'OFF';
  }catch(e){}
}
async function setFlip(axis){
  await fetch('/api/flip/toggle?axis='+axis, {method:'POST', headers: HEADERS});
  tick();
}
async function resetFlip(){
  await fetch('/api/flip/set?h=0&v=0', {method:'POST', headers: HEADERS});
  tick();
}
function openSettings(){
  document.getElementById('setting').classList.add('show');
  loadSettings();
}
function closeSettings(){
  document.getElementById('setting').classList.remove('show');
}
async function loadSettings(){
  const body = document.getElementById('setting-body');
  try{
    const r = await fetch('/api/settings', {headers: HEADERS});
    const items = await r.json();
    const groups = {};
    for(const item of items){
      (groups[item.group] = groups[item.group] || []).push(item);
    }
    let html = '';
    for(const [name, list] of Object.entries(groups)){
      html += '<fieldset><legend>' + esc(name) + '</legend>';
      for(const item of list){
        let input;
        if(item.type === 'bool'){
          input = '<input type="checkbox" data-key="' + esc(item.key) + '"' +
            (item.value === '1' ? ' checked' : '') + '>';
        }else if(item.choices && item.choices.length){
          input = '<select data-key="' + esc(item.key) + '">';
          for(const choice of item.choices){
            input += '<option value="' + esc(choice) + '"' +
              (item.value === choice ? ' selected' : '') + '>' +
              esc(choice) + '</option>';
          }
          input += '</select>';
        }else{
          const kind = item.type === 'text' ? 'text' : 'number';
          const step = item.type === 'float' ? ' step="any"' : '';
          input = '<input type="' + kind + '"' + step + ' data-key="' +
            esc(item.key) + '" value="' + esc(item.value) + '">';
        }
        html += '<label><span>' + esc(item.key) + '</span>' + input + '</label>';
        if(!item.live){
          html += '<label><span></span><small>needs restart</small></label>';
        }
      }
      html += '</fieldset>';
    }
    body.innerHTML = html;
  }catch(e){
    body.innerHTML = 'failed to load settings';
  }
}
async function saveSettings(){
  const payload = {};
  document.querySelectorAll('#setting-body [data-key]').forEach(element => {
    payload[element.dataset.key] = element.type === 'checkbox'
      ? (element.checked ? '1' : '0') : element.value;
  });
  const message = document.getElementById('setting-msg');
  try{
    const r = await fetch('/api/settings', {
      method:'POST',
      headers: Object.assign({'Content-Type':'application/json'}, HEADERS),
      body: JSON.stringify(payload)
    });
    const result = await r.json();
    message.innerText = result.ok
      ? ('Saved' + (result.restart_required.length
          ? ' - restart needed: ' + result.restart_required.join(', ') : ''))
      : 'Save failed';
    await loadSettings();
    tick();
  }catch(e){
    message.innerText = 'Save failed';
  }
}
async function resetSettings(){
  const message = document.getElementById('setting-msg');
  try{
    const r = await fetch('/api/settings/reset', {
      method:'POST', headers: HEADERS
    });
    const result = await r.json();
    message.innerText = result.ok
      ? ('Reset' + (result.restart_required.length
          ? ' - restart needed: ' + result.restart_required.join(', ') : ''))
      : 'Reset failed';
    await loadSettings();
    tick();
  }catch(e){
    message.innerText = 'Reset failed';
  }
}
setInterval(tick, 1000); tick();
</script>
</body>
</html>
