services:
  ai-camera:
    build:
      context: .
      network: host
    image: ai-camera:rk3576
    pull_policy: never
    container_name: ai-camera
    network_mode: host
    devices:
      - "/dev/video11:/dev/video0"
      # /dev/dri mount korle board er renderD129 (Mali GPU) container e ase.
      # Explicit path chaile niche line uncomment koro (host e file thakte hobe):
      # - "/dev/dri/renderD129:/dev/dri/renderD129"
      - "/dev/dri:/dev/dri"
      # NPU (RKNN) — board e /dev/rknpu thakle uncomment koro:
      # - "/dev/rknpu:/dev/rknpu"
    group_add:
      - video
      - render
    volumes:
      - ./models:/app/models
    environment:
      - CAMERA_SOURCE=0
      - YOLO_BACKEND=auto
      - RKNN_MODEL=/app/models/yolo11n-rk3576.rknn
      - RKNPU_CORE=AUTO
      - MODEL_NAME=yolo11n.pt
      - CONF_THRESHOLD=0.5
      - IMG_SIZE=320
      - FRAME_WIDTH=640
      - FRAME_HEIGHT=480
      - JPEG_QUALITY=60
      - STREAM_FPS=25
      - SMOOTH_WINDOW=1.0
      - DETECT_EVERY=2
      - MAX_FACES=3
      - FACE_EVERY=2
      - FACE_BACKEND=auto
      - HEADPOSE_PROVIDER=auto
      - OPENCV_OPENCL=auto
      - TORCH_THREADS=2
      - ORT_THREADS=1
      - FACE_ENABLE=1
      - FACE_SCORE=0.6
      - FACE_MODEL=/app/models/yunet.onnx
      - FACE_MIN_SIZE=60
      - MIVOLO_ENABLE=1
      - MIVOLO_MODEL=iitolstykh/mivolo_v2
      - MIVOLO_REFRESH=3.0
      - MIVOLO_MAX_FACES=1
      - MIVOLO_BLUR=80
      - HEADPOSE_ENABLE=1
      - HEADPOSE_MODEL=/app/models/whenet.onnx
      - LOOK_YAW=25
      - LOOK_PITCH=20
      - FLIP_H=0
      - FLIP_V=0
    restart: unless-stopped
