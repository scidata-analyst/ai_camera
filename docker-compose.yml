services:
  ai-camera:
    build: .
    image: ai-camera:rk3576
    container_name: ai-camera
    ports:
      - "8080:8080"
    # ---- RK3576 board devices ----
    # /dev/video0  = USB webcam
    # /dev/dri/*   = NPU/GPU render node (RKNNLite er jonno must)
    # /dev/rknpu   = NPU core node (kernel onujayi naam vinno hote pare)
    # /dev/mpp_service /dev/rga = Rockchip media/RGA (thakle map hobe)
    # NOTE: kono node board e na thakle compose error dibe —
    # tai shudhu ja ache tai rakho. Check: ls /dev | grep -E "video|dri|rknpu|mpp|rga"
    devices:
      - "/dev/video0:/dev/video0"  # USB webcam; na thakle line ta comment koro
      - "/dev/dri:/dev/dri"        # NPU/GPU — .rknn chalate lagbe
      # - "/dev/rknpu:/dev/rknpu"          # board e thakle uncomment (ls /dev | grep rknpu)
      # - "/dev/mpp_service:/dev/mpp_service"  # Rockchip MPP decode lagle
      # - "/dev/rga:/dev/rga"                # RGA hw resize lagle
    volumes:
      - ./models:/root/.cache  # YOLO weight + HF cache (optional)
      - ./models:/app/models   # yolo11n-rk3576.rknn ekhane rakho (NPU model share)
    environment:
      - CAMERA_SOURCE=0
      # NPU switch: auto = /app/models/yolo11n-rk3576.rknn thakle NPU, naile CPU
      # force CPU চাইলে YOLO_BACKEND=cpu দাও
      - YOLO_BACKEND=auto
      - RKNN_MODEL=/app/models/yolo11n-rk3576.rknn
      - RKNPU_CORE=AUTO  # AUTO | 0 | 1 | 2 (RK3576: 3 core)
      - MODEL_NAME=yolo11n.pt  # CPU fallback model
      - CONF_THRESHOLD=0.5
      - IMG_SIZE=320      # NPU te 320/640 duitai fast; CPU fallback er jonno 320
      - FRAME_WIDTH=640
      - FRAME_HEIGHT=480
      - JPEG_QUALITY=60   # 70->60 encode fast
      - STREAM_FPS=25
      - SMOOTH_WINDOW=1.0  # 1 sec por por mean/median/mode update
      - DETECT_EVERY=2    # CPU mode e YOLO proti 2 frame e 1 bar; NPU te 1 o chole
      - MAX_FACES=3       # sobcheye boro 3 face e headpose
      - TORCH_THREADS=4   # RK3576: 4xA72+4xA53 — NPU chalu thakle 4 best
      - ORT_THREADS=2
      - FACE_ENABLE=1
      - FACE_SCORE=0.6
      - FACE_MODEL=/app/models/yunet.onnx
      - FACE_MIN_SIZE=60   # choto face e gender off (vul komate)
      - MIVOLO_ENABLE=1
      - MIVOLO_MODEL=iitolstykh/mivolo_v2
      - MIVOLO_REFRESH=2.0  # LAG FIX: 1.0->2.0 (heavy model, CPU half)
      - MIVOLO_MAX_FACES=1  # 1 frame e max 1 face e MiVOLO
      - MIVOLO_BLUR=80  # er niche sharpness hole age refresh off (motion blur fix)
      - HEADPOSE_ENABLE=1
      - HEADPOSE_MODEL=/app/models/whenet.onnx
      - LOOK_YAW=25
      - LOOK_PITCH=20
      - FLIP_H=0
      - FLIP_V=0
    restart: unless-stopped
    # NPU + camera permission issue hole uncomment koro:
    # privileged: true  # dorkar hole uncomment (camera/NPU permission issue)
