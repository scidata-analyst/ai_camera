services:
  ai-camera:
    build:
      context: .
      network: host
    image: ai-camera:rk3576
    pull_policy: never
    container_name: ai-camera
    privileged: true
    network_mode: host
    devices:
      - "/dev/video11:/dev/video11"
      # Ubuntu/Rockchip target-e renderD129 holo RKNPU device.
      - "/dev/dri:/dev/dri"
      # RKNN Lite checks this exact NPU node inside Docker.
      - "/dev/dri/renderD129:/dev/dri/renderD129"
    group_add:
      - "44"
      - "108"
    volumes:
      - "/sys:/sys:ro"
      - "/proc/device-tree/compatible:/proc/device-tree/compatible:ro"
      - ./models:/app/models
    environment:
      - CAMERA_SOURCE=/dev/video11
      - YOLO_BACKEND=rknn
      - RKNN_MODEL=/app/models/yolo11n-rk3576.rknn
      - RKNPU_CORE=AUTO
      - MODEL_NAME=/app/models/yolo11n.pt
      - CONF_THRESHOLD=0.5
      - IMG_SIZE=320
      - FRAME_WIDTH=640
      - FRAME_HEIGHT=480
      - JPEG_QUALITY=95
      - STREAM_FPS=25
      - SMOOTH_WINDOW=1.0
      - DETECT_EVERY=2
      - MAX_FACES=3
      - FACE_EVERY=1
      - FACE_BACKEND=rknn
      - FACE_MODEL=/app/models/RetinaFace_mobile320.onnx
      - FACE_RKNN_MODEL=/app/models/RetinaFace_mobile320-rk3576.rknn
      - AGE_GENDER_BACKEND=rknn
      - AGE_GENDER_MODEL=/app/models/genderage.onnx
      - AGE_GENDER_RKNN_MODEL=/app/models/genderage-rk3576.rknn
      - HEADPOSE_PROVIDER=auto
      - HEADPOSE_BACKEND=rknn
      - HEADPOSE_RKNN_MODEL=/app/models/whenet-rk3576.rknn
      - OPENCV_OPENCL=auto
      - TORCH_THREADS=2
      - ORT_THREADS=1
      - FACE_ENABLE=1
      - FACE_SCORE=0.6
      - FACE_MIN_SIZE=60
      - HEADPOSE_ENABLE=1
      - HEADPOSE_MODEL=/app/models/whenet.onnx
      - LOOK_YAW=25
      - LOOK_PITCH=20
      - FLIP_H=0
      - FLIP_V=0
    restart: unless-stopped
