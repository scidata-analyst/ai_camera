services:
  ai-camera:
    build:
      context: .
      network: host
    image: ai-camera:rk3576
    pull_policy: never
    container_name: ai-camera
    privileged: true
    network_mode: host
    devices:
      - "/dev/video11:/dev/video11"
      - "/dev/dri:/dev/dri"
      - "/dev/dri/renderD129:/dev/dri/renderD129"
    group_add:
      - "44"
      - "108"
    volumes:
      - "/sys:/sys:ro"
      - "/proc/device-tree/compatible:/proc/device-tree/compatible:ro"
      - ./models:/app/models
      - ./settings:/app/config
    environment:
      - SETTINGS_FILE=/app/config/saved_settings.json
      - CAMERA_SOURCE=/dev/video11
      - YOLO_BACKEND=rknn
      - RKNN_MODEL=/app/models/yolo11n-rk3576.rknn
      - RKNPU_CORE=AUTO
      - MODEL_NAME=/app/models/yolo11n.pt
      - CONF_THRESHOLD=0.5
      - PERSON_CONF=0.65
      - PERSON_MIN_H=0
      - PERSON_REQUIRE_FACE=0
      - DET_STALE_SEC=0.2
      - YOLO_DEBUG=0
      - IMG_SIZE=320
      - FRAME_WIDTH=640
      - FRAME_HEIGHT=480
      - JPEG_QUALITY=95
      - STREAM_FPS=20
      - CAPTURE_FPS=20
      - INTERVAL=1.0
      - DETECT_EVERY=2
      - FACE_EVERY=1
      - FACE_ENABLE=1
      - FACE_BACKEND=rknn
      - FACE_RKNN_MODEL=/app/models/RetinaFace_mobile320-rk3576.rknn
      - FACE_SCORE=0.75
      - FACE_MIN_SIZE=60
      - FACE_BLUR=80
      - AGE_GENDER_BACKEND=rknn
      - AGE_GENDER_RKNN_MODEL=/app/models/mivolo-face-rk3576.rknn
      - AGE_GENDER_ALIGN=arcface
      - AGE_RKNN_MODEL=/app/models/dlib-age-rk3576.rknn
      - HEADPOSE_ENABLE=1
      - HEADPOSE_BACKEND=rknn
      - HEADPOSE_RKNN_MODEL=/app/models/whenet-rk3576.rknn
      - LOOK_YAW=25
      - LOOK_PITCH=20
      - FLIP_H=0
      - FLIP_V=0
    restart: unless-stopped
